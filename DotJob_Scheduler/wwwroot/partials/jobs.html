<!-- 统计卡片 -->
<div class="row">
    <div class="col-md-3">
        <div class="stat-card total">
            <h3 id="totalJobs">0</h3>
            <p class="mb-0"><i class="bi bi-list-task"></i> 任务总数</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card running">
            <h3 id="runningJobs">0</h3>
            <p class="mb-0"><i class="bi bi-play-circle"></i> 正常</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card paused">
            <h3 id="pausedJobs">0</h3>
            <p class="mb-0"><i class="bi bi-pause-circle"></i> 已暂停</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card blocked">
            <h3 id="blockedJobs">0</h3>
            <p class="mb-0"><i class="bi bi-slash-circle"></i> 阻塞</p>
        </div>
    </div>
</div>

<!-- 搜索区域 -->
<div class="search-box">
    <div class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label">任务名称</label>
            <input type="text" class="form-control" id="searchJobName" placeholder="输入任务名称">
        </div>
        <div class="col-md-3">
            <label class="form-label">任务分组</label>
            <input type="text" class="form-control" id="searchJobGroup" placeholder="输入分组名称">
        </div>
        <div class="col-md-2">
            <label class="form-label">状态</label>
            <select class="form-select" id="searchTriggerState">
                <option value="">全部</option>
                <option value="1">正常</option>
                <option value="2">暂停</option>
                <option value="5">阻塞</option>
            </select>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary me-2" onclick="resetSearch()">
                <i class="bi bi-arrow-clockwise"></i> 重置
            </button>
            <button class="btn btn-primary me-2" onclick="searchJobs()">
                <i class="bi bi-search"></i> 搜索
            </button>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addJobModal">
                <i class="bi bi-plus-lg"></i> 新增任务
            </button>
        </div>
    </div>
</div>

<!-- 任务列表 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-list-task"></i> 任务列表</h5>
        <div class="d-flex align-items-center gap-2">
            <!-- 自动刷新开关 -->
            <div class="d-flex align-items-center gap-1">
                <div class="form-check form-switch mb-0 me-1">
                    <input class="form-check-input" type="checkbox" id="autoRefreshSwitch"
                           onchange="onAutoRefreshToggle()" style="cursor:pointer;">
                    <label class="form-check-label text-muted small" for="autoRefreshSwitch">自动刷新</label>
                </div>
                <select class="form-select form-select-sm" id="autoRefreshInterval"
                        style="width:90px;" onchange="onAutoRefreshToggle()" disabled>
                    <option value="10" selected>10 秒</option>
                    <option value="30">30 秒</option>
                    <option value="60">60 秒</option>
                </select>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="refreshJobs()">
                <i class="bi bi-arrow-clockwise"></i> 刷新
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>任务名称</th>
                        <th>分组</th>
                        <th>状态</th>
                        <th>触发方式</th>
                        <th>上次计划时间</th>
                        <th>下次计划时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="jobTableBody">
                    <tr>
                        <td colspan="7" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- 分页 -->
        <nav aria-label="Page navigation" class="mt-3">
            <ul class="pagination justify-content-center" id="pagination">
            </ul>
        </nav>
    </div>
</div>
