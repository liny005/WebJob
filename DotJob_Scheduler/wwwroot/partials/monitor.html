<!-- 系统监控统计卡片 -->
<div class="row">
    <div class="col-md-3">
        <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <h3 id="cpuUsage">--</h3>
            <p class="mb-0"><i class="bi bi-cpu"></i> CPU 使用率</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <h3 id="memoryUsage">--</h3>
            <p class="mb-0"><i class="bi bi-memory"></i> 内存占用</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
            <h3 id="threadCount">--</h3>
            <p class="mb-0"><i class="bi bi-diagram-3"></i> 活跃线程</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
            <h3 id="avgLatency">--</h3>
            <p class="mb-0"><i class="bi bi-hourglass-split"></i> 平均延迟 <small class="opacity-75" style="font-size:0.7em;">近1000条样本</small></p>
        </div>
    </div>
</div>

<!-- 历史趋势图表 -->
<div class="row mt-4">
    <!-- CPU 趋势 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-cpu"></i> CPU 使用率趋势</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="cpuChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 内存趋势 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-memory"></i> 内存占用趋势</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="memoryChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 线程和延迟趋势 -->
<div class="row mt-4">
    <!-- 活跃线程趋势 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-diagram-3"></i> 活跃线程趋势</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="threadChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 平均延迟趋势 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-hourglass-split"></i> 平均延迟趋势</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="latencyChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 详细监控数据 -->
<div class="row mt-4">
    <!-- 内存详情 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-memory"></i> 内存信息</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-6">
                        <p class="text-muted small mb-1">托管内存</p>
                        <h5 id="managedMemory">-- MB</h5>
                    </div>
                    <div class="col-6">
                        <p class="text-muted small mb-1">工作集</p>
                        <h5 id="workingSet">-- MB</h5>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <p class="text-muted small mb-1">堆大小</p>
                        <h5 id="heapSize">-- MB</h5>
                    </div>
                    <div class="col-6">
                        <p class="text-muted small mb-1">GC 回收次数 (Gen2)</p>
                        <h5 id="gen2Collections">--</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 任务执行延迟统计 -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-hourglass-split"></i> 任务延迟统计 <small class="text-muted fw-normal fs-6">（最近 1000 条样本）</small></h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-6">
                        <p class="text-muted small mb-1">平均延迟</p>
                        <h5 id="jobAvgLatency">-- ms</h5>
                    </div>
                    <div class="col-6">
                        <p class="text-muted small mb-1">最大延迟</p>
                        <h5 id="jobMaxLatency">-- ms</h5>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <p class="text-muted small mb-1">最小延迟</p>
                        <h5 id="jobMinLatency">-- ms</h5>
                    </div>
                    <div class="col-6">
                        <p class="text-muted small mb-1">执行总数</p>
                        <h5 id="jobExecutions">--</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
