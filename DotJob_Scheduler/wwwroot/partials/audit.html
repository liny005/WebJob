<!-- 搜索区域 -->
<div class="search-box">
    <div class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label">操作人</label>
            <input type="text" class="form-control" id="searchAuditOperator" placeholder="输入用户名">
        </div>
        <div class="col-md-3">
            <label class="form-label">操作功能</label>
            <select class="form-select" id="searchAuditAction">
                <option value="">全部</option>
                <option value="用户登录">用户登录</option>
                <option value="新增任务">新增任务</option>
                <option value="修改任务">修改任务</option>
                <option value="删除任务">删除任务</option>
                <option value="暂停任务">暂停任务</option>
                <option value="恢复任务">恢复任务</option>
                <option value="立即执行">立即执行</option>
                <option value="新增用户">新增用户</option>
                <option value="删除用户">删除用户</option>
                <option value="新增推送配置">新增推送配置</option>
                <option value="修改推送配置">修改推送配置</option>
                <option value="删除推送配置">删除推送配置</option>
                <option value="测试推送配置">测试推送配置</option>
            </select>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-outline-secondary me-2" onclick="resetAuditSearch()">
                <i class="bi bi-arrow-clockwise"></i> 重置
            </button>
            <button class="btn btn-primary" onclick="searchAuditLogs()">
                <i class="bi bi-search"></i> 搜索
            </button>
        </div>
    </div>
</div>
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-journal-check"></i> 操作日志</h5>
        <button class="btn btn-outline-primary btn-sm" onclick="loadAuditLogs()">
            <i class="bi bi-arrow-clockwise"></i> 刷新
        </button>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>操作时间</th>
                        <th>操作人</th>
                        <th>操作功能</th>
                        <th>操作对象</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody id="auditTableBody">
                    <tr><td colspan="5" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </td></tr>
                </tbody>
            </table>
        </div>
        <nav class="mt-3">
            <ul class="pagination justify-content-center" id="auditPagination"></ul>
        </nav>
    </div>
</div>
